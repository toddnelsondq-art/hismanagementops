name: HIS OPS code check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check app/app.js
          node --check app/auth.js
          node --check netlify/functions/api.js
          node --check netlify/functions/alerts-scheduled.js
          node --check netlify/functions/assignment-digest-scheduled.js
