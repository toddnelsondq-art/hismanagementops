[build]
  publish = "app"
  functions = "netlify/functions"

[functions]
  included_files = ["data/maintenance_seed.json", "data/area_checklist_seed.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
